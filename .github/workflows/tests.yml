name: Runtime and examples

on:
  pull_request:
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main, feat/parallel-issue-integration]
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  CHAT_PROFILE: demo

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: mix deps.get
      - run: mix test test examples/avatar/server_test.exs
      - run: mix run examples/telephony-loopback.exs
      - run: npm --prefix examples/rtvi-client ci
      - run: npm --prefix examples/rtvi-client test
      - run: npm --prefix examples/rtvi-client run typecheck
      - run: npm --prefix examples/rtvi-client run build
      - run: npm --prefix examples/avatar ci
      - run: npm --prefix examples/avatar test
      - run: npm --prefix examples/avatar run typecheck
      - run: npm --prefix examples/avatar run build

  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [ui, examples/chat]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: mix deps.get
      - run: mix test
      - if: matrix.app == 'examples/chat'
        run: node --test assets/test/audio.test.js
      - run: npm --prefix assets ci
      - run: mix assets.build
