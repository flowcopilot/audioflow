name: Runtime and examples

on:
  pull_request:
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  CHAT_PROFILE: demo

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: mix deps.get
      - run: mix test test examples/avatar/server_test.exs
      - run: mix run examples/telephony-loopback.exs
      - run: npm --prefix examples/rtvi-client ci
      - run: npm --prefix examples/rtvi-client test
      - run: npm --prefix examples/rtvi-client run typecheck
      - run: npm --prefix examples/rtvi-client run build
      - run: npm --prefix examples/avatar ci
      - run: npm --prefix examples/avatar test
      - run: npm --prefix examples/avatar run typecheck
      - run: npm --prefix examples/avatar run build

  sfu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sfu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      # ex_sctp (WebRTC data channels) is a Rust NIF; the runner image has cargo.
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

  # Calls across the SFU and AudioFlow agents (releases/test), and the
  # AudioFlow room participant with a stub SFU.
  agent-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUDIOFLOW_SFU: '1'
      AUDIOFLOW_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/audioflow_test
    services:
      postgres:
        image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audioflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - run: mix deps.get
      - run: >-
          mix test test/sfu_participant_test.exs test/rtp_reorder_test.exs
          test/calls_test.exs test/call_store_test.exs test/session_restore_test.exs
      - run: mix deps.get
        working-directory: releases
      - run: mix test
        working-directory: releases

  # LiveKit client SDKs against the SFU: livekit-client in headless
  # Chromium and the Python SDK.
  sfu-livekit-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sfu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The version in mise.toml.
      - run: python3 -m pip install --user uv==0.13.6
      - run: mix deps.get
      - run: mix compile
      - run: npx --prefix compat/js playwright install-deps chromium-headless-shell || true
      - run: compat/run.sh

  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [ui, examples/chat]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: mix deps.get
      - run: mix test
      - if: matrix.app == 'examples/chat'
        run: node --test assets/test/audio.test.js
      - run: npm --prefix assets ci
      - run: mix assets.build
