name: Runtime and examples

on:
  pull_request:
  push:
    branches: [main, feat/parallel-issue-integration]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  CHAT_PROFILE: demo

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: mix deps.get
      - run: mix test
      - run: mix run examples/telephony-loopback.exs
      - run: npm --prefix examples/rtvi-client ci
      - run: npm --prefix examples/rtvi-client test
      - run: npm --prefix examples/rtvi-client run typecheck
      - run: npm --prefix examples/rtvi-client run build

  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ui, examples/chat]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: mix deps.get
      - run: mix test
      - if: matrix.app == 'examples/chat'
        run: node --test assets/test/audio.test.js
      - run: npm --prefix assets ci
      - run: mix assets.build
