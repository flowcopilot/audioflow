<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Native voice inference smoke run</title><style>
html,body{margin:0;background:none;color:var(--foreground,CanvasText);font-family:var(--font-sans,system-ui);font-size:14px}figure{margin:0}figcaption{font-size:16px;line-height:1.5}.context,.note{color:var(--muted-foreground,GrayText);line-height:1.5;margin:6px 0}svg{display:block;width:100%;height:250px}.label{fill:currentColor;font-size:14px}.tick{fill:var(--muted-foreground,GrayText);font-size:12px}.grid{stroke:var(--border,GrayText);stroke-width:.6}.point{fill:currentColor}.warmup{fill:var(--chart-1,Highlight)}.value{fill:currentColor;font-size:14px;font-variant-numeric:tabular-nums}
</style><figure><figcaption>Time to first audio, in seconds</figcaption><p class="context">Whisper tiny → Qwen3-0.6B → Kokoro. CPU. One active session.</p><svg role="img" aria-label="One warmup and three measured turns, on a common zero to twelve second scale."></svg><p class="note">The warmup includes first-call compilation. Three measured turns reuse the same recording and shared models.</p><p class="note">Input capture, VAD, transport, and device delay are outside this measurement. This small sample does not establish session capacity.</p><p class="note">Source: native-cpu.csv and native-cpu.csv.meta.json. macOS arm64, 24 GiB RAM.</p></figure><script>
const data=[{"label": "Warmup 1", "seconds": 11.951597, "warmup": true}, {"label": "Turn 1", "seconds": 3.955167, "warmup": false}, {"label": "Turn 2", "seconds": 3.728371, "warmup": false}, {"label": "Turn 3", "seconds": 3.203196, "warmup": false}];
const svg=document.querySelector('svg');const ns='http://www.w3.org/2000/svg';
function node(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))n.setAttribute(key,value);if(text!==undefined)n.textContent=text;svg.appendChild(n);return n;}
function draw(){const width=Math.max(280,svg.clientWidth);svg.setAttribute('viewBox',`0 0 ${width} 250`);svg.replaceChildren();const left=92,right=width-62,axis=218;
for(const seconds of [0,4,8,12]){const x=left+(right-left)*seconds/12;node('line',{x1:x,x2:x,y1:22,y2:axis,class:'grid'});node('text',{x,y:axis+21,'text-anchor':'middle',class:'tick'},seconds);}
data.forEach((d,i)=>{const y=45+i*44;node('text',{x:0,y:y+5,class:'label'},d.label);node('circle',{cx:left+(right-left)*d.seconds/12,cy:y,r:3.8,class:d.warmup?'point warmup':'point'});node('text',{x:width-2,y:y+5,'text-anchor':'end',class:'value'},d.seconds.toFixed(2)+' s');});}
new ResizeObserver(draw).observe(svg);draw();
</script></html>
